sonar.organization=victron-venus
sonar.projectKey=victron-venus_inverter-dashboard-go
sonar.sources=.
# Reviewed python:S8707 false positives in the frozen shared release helpers.
# prepare_version.py writes validated version text as content to fixed pr-body.md;
# release_versioned.py writes manifest content to a fixed private stage destination.
# Neither content value selects the output path. Automatic Analysis supports exact
# file exclusions here, so retain analysis of the other release helpers.
sonar.exclusions=**/*_test.go,**/vendor/**,**/*.pb.go,scripts/prepare_version.py,scripts/release_versioned.py
sonar.sourceEncoding=UTF-8
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out

# Ignore cognitive complexity for data parsing/mapping functions (intentional design)
# These are standard JSON/YAML deserializers with many type switches
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/mqtt/client.go
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/homeassistant/client.go
sonar.issue.ignore.multicriteria.e3.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/config/config.go
sonar.issue.ignore.multicriteria.e4.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e4.resourceKey=**/websocket/handler.go
