name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  # No longer needed as we specify image in the job
  # REGISTRY: docker.io
  # IMAGE_NAME: alvit/inverter-dashboard-go

permissions:
  contents: read
  # Required for SBOM / provenance attestations (supply chain, Docker Scout).
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push Docker image
        uses: victron-venus/venus-os-ci-toolkit/.github/workflows/docker-build.yml@c817fbf
        with:
          skip-checkout: true
          skip-setup-buildx: true
          image: docker.io/alvit/inverter-dashboard-go
          platforms: linux/amd64,linux/arm64
          push: true
        secrets:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
