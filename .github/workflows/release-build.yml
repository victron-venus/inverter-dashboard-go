name: Build release assets
'on':
  workflow_call:
    inputs:
      version:
        description: Committed base version, without a v prefix or channel suffix
        required: true
        type: string
      channel:
        description: nightly, beta or rc; stable promotes existing RC bytes
        required: true
        type: string
      release_plan_artifact:
        description: Frozen version plan artifact allocated by the release workflow
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
defaults:
  run:
    shell: bash
jobs:
  binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - goos: darwin
          goarch: arm64
          name: macos-silicon
        - goos: linux
          goarch: arm64
          name: linux-arm64
        - goos: linux
          goarch: arm
          goarm: 7
          name: raspberry-pi3
        - goos: linux
          goarch: amd64
          name: linux-amd64
        - goos: darwin
          goarch: amd64
          name: macos-intel
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up release version tooling
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Download frozen release version plan
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ inputs.release_plan_artifact }}
        path: .
    - name: Apply frozen release version inputs
      shell: bash
      run: python3 scripts/version_plan.py sync --root . --plan .release-plan.json
    - name: Verify committed release version
      run: python3 scripts/check-release-version.py "$RELEASE_VERSION" "$RELEASE_CHANNEL"
    - name: Verify versioned Vue assets
      run: test -s internal/html/vue-ui/index.html
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
        CGO_ENABLED: 0
      run: "output_name=\"inverter-dashboard-${{ matrix.name }}\"\nif [ \"${{ matrix.goos }}\" = \"windows\" ]; then\n  output_name=\"${output_name}.exe\"\nfi\npackage_version=$(tr -d '\\r\\n' < VERSION)\nldflags=\"-s -w -X main.Version=$package_version\"\ngo build -ldflags \"$ldflags\" -o \"dist/${output_name}\" .\npython3 scripts/write_binary_build_metadata.py \"dist/${output_name}\" \"dist/inverter-dashboard-${{ matrix.name }}.version.json\"\n"
    - name: Smoke test native release binary
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: 'package_version=$(tr -d ''\r\n'' < VERSION)

        actual=$(dist/inverter-dashboard-linux-amd64 --version)

        test "$actual" = "Inverter Dashboard v$package_version"

        '
    - name: Verify and stage versioned release assets
      shell: bash
      env:
        RELEASE_ASSET_TARGET: ${{ matrix.name }}
        RELEASE_ASSET_PATTERN_0: dist/inverter-dashboard-${{ matrix.name }}*
      run: python3 scripts/stage_release_assets.py --target "$RELEASE_ASSET_TARGET" --pattern "$RELEASE_ASSET_PATTERN_0"
    - name: Store release assets
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-assets-${{ matrix.name }}
        path: release-assets/${{ matrix.name }}/*
        if-no-files-found: error
        retention-days: 14
  container:
    name: Build container archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up release version tooling
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Download frozen release version plan
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ inputs.release_plan_artifact }}
        path: .
    - name: Apply frozen release version inputs
      shell: bash
      run: python3 scripts/version_plan.py sync --root . --plan .release-plan.json
    - name: Verify committed release version
      run: python3 scripts/check-release-version.py "$RELEASE_VERSION" "$RELEASE_CHANNEL"
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Check container version metadata
      id: image-version
      run: python3 scripts/release_container_labels.py --github-output "$GITHUB_OUTPUT"
    - name: Build OCI image archive
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: false
        outputs: type=oci,dest=inverter-dashboard-go-container.oci.tar
        tags: inverter-dashboard-go:${{ inputs.version }}
        sbom: true
        provenance: mode=max
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: 'org.opencontainers.image.version=${{ steps.image-version.outputs.version }}

          org.opencontainers.image.revision=${{ steps.image-version.outputs.revision }}

          '
    - name: Verify and stage versioned release assets
      shell: bash
      env:
        RELEASE_ASSET_TARGET: container
        RELEASE_ASSET_PATTERN_0: inverter-dashboard-go-container.oci.tar
      run: python3 scripts/stage_release_assets.py --target "$RELEASE_ASSET_TARGET" --pattern "$RELEASE_ASSET_PATTERN_0"
    - name: Store release assets
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-assets-container
        path: release-assets/container/*
        if-no-files-found: error
        retention-days: 14
