name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/go-ci.yml@875762362bb31b4899bf02fdf9e835188dc5eb80
    with:
      # go-version: '1.23'  # default from workflow
      # working-directory: '.'  # default
      # run-lint: true  # default
      # run-tests: true  # default
      # test-args: '-race -coverprofile=coverage.out -covermode=atomic'  # default
      # coverage-threshold: 70  # default
      # run-vulncheck: true  # default
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
