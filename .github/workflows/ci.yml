name: CI

on:
  workflow_call: {}
permissions:
  contents: read

jobs:
  browser-compatibility:
    name: Embedded frontend browser acceptance
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/typescript-ci.yml@5b72b09e8a6bf17b482124891f17fd9662182bf6
    permissions:
      contents: read
    with:
      node-version: '22'
      run-node-ci: false
      browser-matrix-file: .github/browser-compatibility.json
      browser-release-channel: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.channel || '' }}
      browser-test-command: node scripts/browser-acceptance.cjs
      browser-prepare-command: node --check scripts/browser-acceptance.cjs
      browser-extended: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.channel == '' || github.event.inputs.channel == 'rc')) }}
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/go-ci.yml@21a366f200f0371a10a6de7ad6ca263af230b842 # main
    with:
      go-version: '1.26.9'
      # working-directory: '.'  # default
      # run-lint: true  # default
      # run-tests: true  # default
      # test-args: '-race -coverprofile=coverage.out -covermode=atomic'  # default
      # Core packages (state, settings, websocket, mqtt, auth) have tests;
      # gate set to 20% to prevent regression while allowing incremental coverage.
      coverage-threshold: 20
      # run-vulncheck: true  # default

  integration:
    name: Integration Tests
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    # NOTE: integration-tests/.github/workflows/integration.yml has workflow_call but
    # assumes sibling repo layout (../inverter-dashboard). We implement the pattern
    # locally instead of workflow_call.
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify published frontend import contracts
        run: python3 -m unittest discover -s scripts -p 'test_*vue*.py'
      - name: Checkout integration-tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: victron-venus/integration-tests
          # Includes fix for test_websocket_connection infinite-recv timeout
          # (victron-venus/integration-tests#90).
          ref: 9c4f97e3229c0b0db50939d3a2301db9260c9036
          path: integration-tests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        run: |
          # Context must be integration-tests/ so COPY tests works. This repo's
          # .dockerignore excludes tests/ (keeps the production build lean), and
          # context "." would also copy the wrong tests/ (unit tests).
          docker build \
            -f integration-tests/Dockerfile.test-runner \
            -t test-runner \
            integration-tests

      - name: Start test stack
        working-directory: integration-tests
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            up -d --build mqtt-broker mock-dbus mock-battery mock-pv
          sleep 5

      - name: Build candidate Go dashboard test image
        run: |
          # Build the candidate revision with its committed embedded SPA.
          # The override connects its production image to the mock broker.
          docker build -t dashboard-go -f Dockerfile .
          docker compose \
            --project-directory integration-tests \
            -f integration-tests/docker-compose.yml \
            -f integration-tests/docker-compose.test.yml \
            -f "$GITHUB_WORKSPACE/.github/compose.integration.override.yml" \
            up -d dashboard-go
          sleep 10

      - name: Run integration tests
        run: |
          docker compose \
            --project-directory integration-tests \
            -f integration-tests/docker-compose.yml \
            -f integration-tests/docker-compose.test.yml \
            -f "$GITHUB_WORKSPACE/.github/compose.integration.override.yml" \
            run --rm \
            -e DASHBOARD_URL=ws://dashboard-go:8080/ws \
            -e MQTT_HOST=mqtt-broker \
            -e MQTT_PORT=1883 \
            test-runner python -m pytest tests/ -v --tb=short

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-report
          path: report.html
          retention-days: 7

      - name: Tear down
        if: always()
        run: |
          docker compose \
            --project-directory integration-tests \
            -f integration-tests/docker-compose.yml \
            -f integration-tests/docker-compose.test.yml \
            -f "$GITHUB_WORKSPACE/.github/compose.integration.override.yml" \
            down -v
    timeout-minutes: 30
