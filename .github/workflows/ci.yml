name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.json'
      - '**.yaml'
      - '**.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.json'
      - '**.yaml'
      - '**.yml'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/go-ci.yml@5b18667880c7a0154b7c7e6686042eff5f47cdb7
    with:
      go-version: '1.26.6'
      # working-directory: '.'  # default
      # run-lint: true  # default
      # run-tests: true  # default
      # test-args: '-race -coverprofile=coverage.out -covermode=atomic'  # default
      # Core packages (state, settings, websocket, mqtt, auth) have tests;
      # gate set to 20% to prevent regression while allowing incremental coverage.
      coverage-threshold: 20
      # run-vulncheck: true  # default

  integration:
    name: Integration Tests
    uses: victron-venus/integration-tests/.github/workflows/integration.yml@442f474e5620100ae953235e8674eda24b44d387
    # Run on PRs only; the integration-tests repo also runs this workflow
    # directly on its own main/push/schedule triggers.
    if: github.event_name == 'pull_request'
