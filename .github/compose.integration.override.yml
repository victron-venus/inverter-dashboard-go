# The pinned integration harness is checked out inside this candidate repository.
services:
  test-runner:
    image: test-runner
    pull_policy: never
  dashboard-go:
    image: dashboard-go
    pull_policy: never
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_PORT: "1883"
      WEB_PORT: "8080"
