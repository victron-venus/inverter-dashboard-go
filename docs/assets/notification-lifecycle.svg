<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
  <title id="title">Notification lifecycle: source time, priming and delivery</title>
  <desc id="desc">Native warnings keep their original occurrence time for display. The current source generation and startup or reconnect priming determine whether an event is new. Unknown-time history and baseline hydration do not become fresh events. Eligible push events pass severity, time and persistent deduplication checks before entering a private bounded queue. The sender uses encrypted Web Push with a remaining lifetime and limited retries. Provider acceptance is distinct from operating-system display. Synthetic events require two fresh observations from the same selected device and do not infer grid loss from power.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52667a"/></marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #142b42; }
      .heading { font-size: 28px; font-weight: 700; }
      .sub { font-size: 16px; fill: #476078; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .note { font-size: 14px; fill: #476078; }
      .box { fill: #fff; stroke: #c4d3df; stroke-width: 1.5; }
      .flow { fill: none; stroke: #52667a; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1160" height="720" rx="18" fill="#f3f7fb"/>
  <text x="28" y="46" class="heading">An old event does not become new on reconnect</text>
  <text x="28" y="77" class="sub">Preserve occurrence time. Validate the source. Distinguish delivery stages.</text>
  <rect x="28" y="130" width="270" height="150" rx="12" class="box"/>
  <text x="48" y="165" class="label">1 · Native source event</text>
  <text x="48" y="199" class="body">ID, severity and lifecycle</text>
  <text x="48" y="228" class="body">Original DateTime</text>
  <text x="48" y="258" class="note">Missing / invalid time stays unknown</text>
  <rect x="360" y="130" width="300" height="150" rx="12" class="box"/>
  <text x="380" y="165" class="label">2 · Current source epoch</text>
  <text x="380" y="199" class="body">Reject retired callbacks</text>
  <text x="380" y="228" class="body">Prime initial / reconnect history</text>
  <text x="380" y="258" class="note">Do not replay old alarms as new push</text>
  <rect x="722" y="130" width="410" height="150" rx="12" fill="#e8f1fb" stroke="#86a9d0" stroke-width="1.5"/>
  <text x="744" y="165" class="label">3 · New push eligibility</text>
  <text x="744" y="199" class="body">Known warning/alarm, permitted preference</text>
  <text x="744" y="228" class="body">Source age ≤ 300 s; future allowance ≤ 30 s</text>
  <text x="744" y="258" class="note">Persistent deduplication: latest 4096 event keys</text>
  <rect x="28" y="365" width="270" height="145" rx="12" class="box"/>
  <text x="48" y="400" class="label">Dashboard presentation</text>
  <text x="48" y="434" class="body">Exact local timestamp / zone</text>
  <text x="48" y="463" class="body">Age updates without new data</text>
  <text x="48" y="492" class="note">Visible history may produce no push</text>
  <rect x="360" y="365" width="300" height="145" rx="12" class="box"/>
  <text x="380" y="400" class="label">Silent baseline</text>
  <text x="380" y="434" class="body">Existing history / late hydration</text>
  <text x="380" y="463" class="body">Unknown time never uses receipt time</text>
  <text x="380" y="492" class="note">New occurrences are evaluated separately</text>
  <rect x="722" y="365" width="410" height="145" rx="12" fill="#e8f4ef" stroke="#8ab9a5" stroke-width="1.5"/>
  <text x="744" y="400" class="label">4 · Private durable queue</text>
  <text x="744" y="434" class="body">64 subscriptions · 1024 pending deliveries</text>
  <text x="744" y="463" class="body">2 concurrent sends · at most 3 attempts</text>
  <text x="744" y="492" class="note">Remaining event lifetime, not a new 300 s on retry</text>
  <rect x="28" y="570" width="632" height="115" rx="12" class="box"/>
  <text x="48" y="603" class="label">Synthetic events also require fresh source observations</text>
  <text x="48" y="632" class="body">Two samples, same selected device, at most 30 s apart.</text>
  <text x="48" y="660" class="note">Retained / unknown / disconnected resets baseline. No grid loss from watts.</text>
  <rect x="722" y="570" width="410" height="115" rx="12" class="box"/>
  <text x="744" y="603" class="label">5 · Provider → browser → OS</text>
  <text x="744" y="632" class="body">Encrypted Web Push; OS permission applies</text>
  <text x="744" y="660" class="note">Queued ≠ provider accepted ≠ displayed</text>
  <path d="M298 204 H360" class="flow"/>
  <path d="M660 204 H722" class="flow"/>
  <path d="M163 280 V365" class="flow"/>
  <path d="M510 280 V365" class="flow"/>
  <path d="M927 280 V365" class="flow"/>
  <path d="M927 510 V570" class="flow"/>
  <rect x="28" y="307" width="270" height="25" fill="#f3f7fb"/>
  <rect x="375" y="307" width="270" height="25" fill="#f3f7fb"/>
  <rect x="735" y="307" width="270" height="25" fill="#f3f7fb"/>
  <text x="30" y="325" class="note">Original time, not receipt time</text>
  <text x="383" y="325" class="note">Initial history stays silent</text>
  <text x="745" y="325" class="note">Only eligible current events</text>
</svg>
