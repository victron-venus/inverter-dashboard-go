# EXAMPLE ONLY — do not commit real tokens.
# Put GATEWAY_API_TOKEN in a live Secret out-of-band for native HTTPS.
#
# kubectl -n inverter-dashboard-go create secret generic inverter-dashboard-go-gateway \
#   --from-file=GATEWAY_API_TOKEN=/private/path/gateway-api-token
# Cloudflare Access is optional for an Access-protected public HTTPS endpoint.
# Configure both GATEWAY_ACCESS_CLIENT_ID and GATEWAY_ACCESS_CLIENT_SECRET then,
# and remove/override the explicit empty Access env values in 03-deployment.yaml.
#
# Optional HA config.yaml Secret (separate):
# kubectl -n inverter-dashboard-go create secret generic inverter-dashboard-go-config \
#   --from-file=config.yaml=./config.yaml
apiVersion: v1
kind: Secret
metadata:
  name: inverter-dashboard-go-gateway
  labels:
    app: inverter-dashboard-go
type: Opaque
stringData:
  GATEWAY_API_TOKEN: "replace-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: inverter-dashboard-go-config
  labels:
    app: inverter-dashboard-go
type: Opaque
stringData:
  config.yaml: |
    # Example IGW-only config.yaml (HA optional). Never commit real tokens.
    mqtt:
      host: ""
      port: 0
    gateway:
      enabled: true
      url: "https://igw.s.2560801.xyz:9151"
      # GATEWAY_API_TOKEN is supplied by the separate Secret above.
      poll_interval_seconds: 2
    web:
      host: "0.0.0.0"
      port: 8080
    logging:
      level: "info"
      format: "json"
    cerbo:
      portal_id: "b827ebea1ece"
    homeassistant:
      url: "http://homeassistant.homeassistant.svc.cluster.local:8123"
      token: "replace-me"
      poll_interval_seconds: 12
