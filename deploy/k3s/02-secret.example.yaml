# EXAMPLE ONLY — do not commit real tokens.
# Binary reads ./config.yaml from WORKDIR /app (see internal/config loadConfigYAML).
# Apply a real Secret out-of-band, then mount config.yaml at /app/config.yaml (subPath).
#
# kubectl -n inverter-dashboard-go create secret generic inverter-dashboard-go-config \
#   --from-file=config.yaml=./config.yaml
apiVersion: v1
kind: Secret
metadata:
  name: inverter-dashboard-go-config
  labels:
    app: inverter-dashboard-go
type: Opaque
stringData:
  config.yaml: |
    # Example only — fill HA token out-of-band; never commit real values.
    mqtt:
      host: "192.168.160.150"
      port: 1883
    web:
      host: "0.0.0.0"
      port: 8080
    logging:
      level: "info"
      format: "json"
    cerbo:
      portal_id: ""
    homeassistant:
      url: "http://homeassistant.homeassistant.svc.cluster.local:8123"
      token: "replace-me"
      poll_interval_seconds: 12
