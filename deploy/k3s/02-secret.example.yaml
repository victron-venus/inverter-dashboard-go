# EXAMPLE ONLY — do not commit real tokens.
# Put CF Access + GATEWAY_API_TOKEN in a live Secret out-of-band.
#
# kubectl -n inverter-dashboard-go create secret generic inverter-dashboard-go-gateway \
#   --from-literal=GATEWAY_ACCESS_CLIENT_ID='....access' \
#   --from-literal=GATEWAY_ACCESS_CLIENT_SECRET='cfast_...' \
#   --from-literal=GATEWAY_API_TOKEN='...'
#
# Optional HA config.yaml Secret (separate):
# kubectl -n inverter-dashboard-go create secret generic inverter-dashboard-go-config \
#   --from-file=config.yaml=./config.yaml
apiVersion: v1
kind: Secret
metadata:
  name: inverter-dashboard-go-gateway
  labels:
    app: inverter-dashboard-go
type: Opaque
stringData:
  GATEWAY_ACCESS_CLIENT_ID: "replace-me.access"
  GATEWAY_ACCESS_CLIENT_SECRET: "replace-me"
  GATEWAY_API_TOKEN: "replace-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: inverter-dashboard-go-config
  labels:
    app: inverter-dashboard-go
type: Opaque
stringData:
  config.yaml: |
    # Example IGW-only config.yaml (HA optional). Never commit real tokens.
    mqtt:
      host: ""
      port: 0
    gateway:
      enabled: true
      url: "https://victron.2560801.xyz"
      access_client_id: "from-env-preferred"
      access_client_secret: "from-env-preferred"
      api_token: "from-env-preferred"
      poll_interval_seconds: 2
    web:
      host: "0.0.0.0"
      port: 8080
    logging:
      level: "info"
      format: "json"
    cerbo:
      portal_id: "b827ebea1ece"
    homeassistant:
      url: "http://homeassistant.homeassistant.svc.cluster.local:8123"
      token: "replace-me"
      poll_interval_seconds: 12
