apiVersion: v1
kind: ConfigMap
metadata:
  name: inverter-dashboard-go
  labels:
    app: inverter-dashboard-go
data:
  # Clear the image's legacy MQTT_HOST default for IGW-only deployment.
  MQTT_HOST: ""
  # Code still prefers Cerbo MQTT when MQTT_HOST is set and reachable; IGW is failover.
  WEB_PORT: "8080"
  WEB_HOST: "0.0.0.0"
  GATEWAY_ENABLED: "true"
  GATEWAY_URL: "https://igw.s.2560801.xyz:9151"
  GATEWAY_POLL_INTERVAL_SECONDS: "2"
  # Optional Cerbo portal metadata for water/EV instance mapping from snapshot
  CERBO_PORTAL_ID: "b827ebea1ece"
